# Verety: Observabilidade (ADR-009). Serviço: consolidado.
# Perfil: ative com SPRING_PROFILES_ACTIVE=...,observability.
# Micrometer/actuator apenas (sem APM pago, sem nó novo). Prometheus registry não está no reactor:
# exponha as métricas pelo endpoint nativo /actuator/metrics.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    metrics:
      enabled: true

verety:
  observability:
    # Defasagem de rollup (s) acima da qual o health do consolidado fica DOWN (limiar com responsável).
    consolidado:
      lag-warn-seconds: ${VERETY_CONSOLIDADO_LAG_WARN_SECONDS:300}
